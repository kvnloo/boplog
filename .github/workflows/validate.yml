name: Validate site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check

      - name: Collector smoke (portfolio sync repair PR)
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/incremental-sync-and-portfolio-manifest'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USER: kvnloo
          SITE_URL: https://kvnloo.github.io/boplog
        run: |
          npm run sync
          npm run sync:oss
          npm run check
          npm run check:freshness
      - name: Validate agent interfaces
        run: |
          python3 -m py_compile boplog mcp/boplog_mcp.py
          python3 -m json.tool openapi.json >/dev/null
          python3 -m json.tool .well-known/agent-skills >/dev/null
          python3 -m json.tool .well-known/mcp >/dev/null
          sh -n skills.sh
