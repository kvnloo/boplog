name: Sync GitHub builds

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-github.mjs'
      - 'scripts/collect-oss-contributions.mjs'
      - 'scripts/merged-pr-timestamps.mjs'
      - 'scripts/search-pages.mjs'
      - 'scripts/check-live-publish.mjs'
      - 'scripts/wait-for-budget.mjs'
      - '.github/workflows/sync-github.yml'
      - 'data/featured.json'
  schedule:
    # A few times/day. */15 burned the Actions GITHUB_TOKEN 1000/hr budget.
    - cron: '0 6,14,22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-github
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so the bot can push back to the default branch.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Avoid a wasted partial crawl when other repository work exhausted
      # this GitHub installation token during the same hour.
      - name: Wait for GitHub API budget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/wait-for-budget.mjs

      - name: Sync repos I have committed to
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: kvnloo
          SITE_URL: https://kvnloo.github.io/boplog
        run: node scripts/sync-github.mjs

      - name: Sync public OSS contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: kvnloo
        run: node scripts/collect-oss-contributions.mjs

      - name: Validate snapshot
        run: npm run check

      - name: Enforce evidence freshness
        run: npm run check:freshness

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ feed.xml llms.txt sitemap.xml
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore: sync public builds from GitHub"
          git push

      # A GITHUB_TOKEN-authored git push does not trigger a Pages build.
      # Deploy the exact regenerated workspace as an artifact in this run.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload fresh Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy refreshed site
        id: pages-deploy
        uses: actions/deploy-pages@v4

      - name: Verify live site matches generated artifacts
        env:
          PAGES_URL: ${{ steps.pages-deploy.outputs.page_url }}
        run: node scripts/check-live-publish.mjs
