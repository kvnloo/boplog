name: Sync GitHub builds

on:
  schedule:
    # A few times/day. */15 burned the Actions GITHUB_TOKEN 1000/hr budget.
    - cron: '0 6,14,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-github
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so the bot can push back to the default branch.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync repos I have committed to
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: kvnloo
          SITE_URL: https://kvnloo.github.io/boplog
        run: node scripts/sync-github.mjs

      - name: Sync public OSS contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: kvnloo
        run: node scripts/collect-oss-contributions.mjs

      - name: Validate snapshot
        run: npm run check

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ feed.xml llms.txt sitemap.xml
          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore: sync public builds from GitHub"
          git push
